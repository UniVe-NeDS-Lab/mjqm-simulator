# Tests that the loader rejects negative arrival.prob values.
# Both negative classes are reported before the function returns (all-errors-before-fail).
# Expected: load errors for class 0 (prob=-0.5) and class 1 (prob=-0.1), then exit.
identifier  = "ap_negative_prob_test"
events      = 1000
repetitions = 1
cores       = 6
policy      = "first fit"
service.distribution = "exponential"

arrival.mode         = "shared"
arrival.distribution = "deterministic"
arrival.value        = 1.0

[[class]]
cores        = 1
arrival.prob = -0.5   # intentionally negative
service.mean = 0.5

[[class]]
cores        = 2
arrival.prob = -0.1   # intentionally negative — second error to verify all-errors-before-fail
service.mean = 0.8

[[class]]
cores        = 3
arrival.prob = 1.6
service.mean = 1.0
